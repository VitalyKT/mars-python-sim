<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Rover - First Contact</title>
    <style>
        :root {
            --neon-cyan: #66fcf1;
            --mars-red: #ff4d00;
            --space-bg: #0b0c10;
        }

        body {
            background-color: var(--space-bg);
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #terminal-container {
            width: 95%;
            max-width: 650px;
            background: #1f2833;
            border: 2px solid #45a29e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.1);
            position: relative;
        }

        #output {
            height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .line { margin: 0; font-size: 14px; line-height: 1.4; }
        .system { color: #888; font-style: italic; }
        .error { color: var(--mars-red); font-weight: bold; border-left: 3px solid var(--mars-red); padding-left: 10px; }
        .user-msg { color: #fff; font-weight: bold; }
        .binary { color: #45a29e; font-size: 10px; opacity: 0.6; word-break: break-all; }

        #input-area {
            display: flex;
            border-top: 1px solid #333;
            padding-top: 15px;
            align-items: center;
        }

        #prompt { color: var(--neon-cyan); margin-right: 10px; font-weight: bold; }

        #commandInput {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }

        button {
            background: #45a29e;
            border: none;
            color: #0b0c10;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
        }

        button:hover { background: var(--neon-cyan); }
    </style>
</head>
<body>

<div id="terminal-container">
    <div style="text-align: center; margin-bottom: 15px;">
        <h3 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">🛰️ ТЕРМИНАЛ СВЯЗИ "ЗЕМЛЯ-МАРС"</h3>
    </div>

    <div id="output">
        <div class="line system">[СИСТЕМА]: Соединение с объектом "Черепашка-1" установлено.</div>
        <div class="line system">[СИСТЕМА]: Канал связи открыт. Ожидание команды от Навигатора...</div>
        <div class="line" style="color: #fff;">Попробуй поздороваться с марсоходом или дай ему любую команду:</div>
    </div>

    <div id="input-area">
        <span id="prompt">>>></span>
        <input type="text" id="commandInput" placeholder="Введите текст..." autofocus autocomplete="off">
        <button id="sendBtn">ОТПРАВИТЬ</button>
    </div>
</div>

<script>
    const input = document.getElementById('commandInput');
    const sendBtn = document.getElementById('sendBtn');
    const output = document.getElementById('output');

    function generateBinary(len) {
        let res = "";
        for(let i=0; i<len; i++) res += Math.round(Math.random());
        return res;
    }

    function process() {
        const text = input.value.trim();
        if (!text) return;

        // Печатаем сообщение пользователя
        const userDiv = document.createElement('div');
        userDiv.className = 'line user-msg';
        userDiv.textContent = `ЗЕМЛЯ: ${text}`;
        output.appendChild(userDiv);

        input.value = '';

        // Имитация "задержки" сигнала и ошибки
        setTimeout(() => {
            const binDiv = document.createElement('div');
            binDiv.className = 'line binary';
            binDiv.textContent = "[RAW DATA]: " + generateBinary(120);
            output.appendChild(binDiv);

            const errDiv = document.createElement('div');
            errDiv.className = 'line error';
            errDiv.innerHTML = `❌ ОШИБКА ПРОТОКОЛА: Команда "${text}" не распознана бортовым компьютером.<br>Статус: Несовместимый формат данных.`;
            output.appendChild(errDiv);

            output.scrollTop = output.scrollHeight;
        }, 800);
    }

    sendBtn.onclick = process;
    input.onkeypress = (e) => { if(e.key === 'Enter') process(); };
</script>

</body>
</html>
