<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --neon: #66fcf1; --bg: #0b0c10; --error: #ff4d00; --success: #2ecc71; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; padding: 20px; margin: 0; text-align: center; }
        .terminal-box { background: #000; border: 2px solid #444; border-radius: 10px; padding: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 0 15px rgba(102, 252, 241, 0.1); }
        textarea { width: 90%; background: transparent; color: var(--neon); border: none; outline: none; font-size: 16px; resize: none; height: 80px; }
        .btn { background: var(--neon); color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; margin-top: 15px; border-radius: 5px; text-transform: uppercase; }
        #status { margin-top: 20px; min-height: 50px; font-size: 14px; }
        .rover-icon { width: 80px; height: 80px; margin: 10px auto; display: none; filter: drop-shadow(0 0 5px var(--neon)); }
    </style>
</head>
<body>
    <div class="terminal-box">
        <div style="color: #444; font-size: 10px; margin-bottom: 10px; text-align: left;">BOOT_SEQUENCE_TERMINAL v.1.0</div>
        <textarea id="code" placeholder="# Введи команды здесь..."></textarea>
    </div>
    
    <button class="btn" onclick="checkBoot()">АКТИВИРОВАТЬ ▶️</button>

    <div id="status"></div>
    
    <svg class="rover-icon" id="rover" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" stroke="#66fcf1" stroke-width="2" fill="none" />
        <path d="M30 60 L70 60 L60 40 L40 40 Z" fill="#66fcf1" />
        <circle cx="35" cy="65" r="5" fill="#fff" />
        <circle cx="65" cy="65" r="5" fill="#fff" />
        <line x1="50" y1="40" x2="50" y2="25" stroke="#fff" stroke-width="2" />
    </svg>

<script>
    function checkBoot() {
        const code = document.getElementById('code').value;
        const status = document.getElementById('status');
        const rover = document.getElementById('rover');
        
        const hasImport = code.includes('import turtle');
        const hasObject = code.includes('rover = turtle.Turtle()');

        if (hasImport && hasObject) {
            status.innerHTML = "<span style='color:var(--success)'>✅ СИСТЕМЫ ПОДКЛЮЧЕНЫ!<br>Ровер 'Pioneer-1' онлайн. Связь установлена.</span>";
            rover.style.display = 'block';
        } else if (hasImport && !hasObject) {
            status.innerHTML = "<span style='color:var(--error)'>⚠️ БИБЛИОТЕКА ЗАГРУЖЕНА...<br>Но ровер не создан. Добавь команду: rover = turtle.Turtle()</span>";
            rover.style.display = 'none';
        } else {
            status.innerHTML = "<span style='color:var(--error)'>❌ ОШИБКА ДОСТУПА.<br>Начни с команды: import turtle</span>";
            rover.style.display = 'none';
        }
    }
</script>
</body>
</html>
