<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <style>
        :root { --neon: #66fcf1; --bg: #0b0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        #terminal { background: #000; border: 2px solid #444; border-radius: 10px; padding: 20px; max-width: 600px; margin: 0 auto; text-align: left; }
        textarea { width: 100%; background: transparent; color: var(--neon); border: none; outline: none; font-size: 18px; resize: none; height: 100px; }
        #status-panel { margin-top: 20px; padding: 15px; border-radius: 5px; background: #1f2833; display: none; }
        .success { color: #2ecc71; font-weight: bold; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        #rover-view { width: 100px; height: 100px; margin: 20px auto; display: none; border: 2px dashed var(--neon); border-radius: 50%; padding: 10px; }
    </style>
</head>
<body>
    <h2>🔐 СИСТЕМА АКТИВАЦИИ РОВЕРА</h2>
    <p>Введите протокол запуска, чтобы оживить Пионера-1</p>

    <div id="terminal">
        <textarea id="code" placeholder="# Напиши команды активации здесь..."></textarea>
    </div>
    <button class="btn" onclick="checkBoot()">ВЫПОЛНИТЬ ЗАПУСК ▶️</button>

    <div id="status-panel">
        <div id="msg"></div>
        <div id="rover-view">
            <svg viewBox="0 0 100 100" width="80" height="80">
                <rect x="30" y="30" width="40" height="30" fill="#cfd8dc" />
                <rect x="25" y="25" width="10" height="10" fill="#263238" />
                <rect x="65" y="25" width="10" height="10" fill="#263238" />
                <rect x="25" y="65" width="10" height="10" fill="#263238" />
                <rect x="65" y="65" width="10" height="10" fill="#263238" />
                <rect x="55" y="40" width="10" height="10" fill="#546e7a" />
                <line x1="70" y1="45" x2="90" y2="45" stroke="#ffff00" stroke-width="4" />
            </svg>
        </div>
    </div>

<script>
    function checkBoot() {
        const code = document.getElementById('code').value;
        const panel = document.getElementById('status-panel');
        const msg = document.getElementById('msg');
        const rover = document.getElementById('rover-view');
        
        panel.style.display = 'block';
        
        const hasImport = code.includes('import turtle');
        const hasObject = code.includes('rover = turtle.Turtle()');

        if (hasImport && hasObject) {
            msg.innerHTML = "<span class='success'>✅ СИСТЕМЫ ОНЛАЙН!</span><br>Библиотека загружена. Объект 'rover' создан и готов к работе.";
            rover.style.display = 'block';
        } else if (hasImport && !hasObject) {
            msg.innerHTML = "⚠️ БИБЛИОТЕКА ЗАГРУЖЕНА, но ровер не создан.<br>Добавь строку: <b>rover = turtle.Turtle()</b>";
            rover.style.display = 'none';
        } else {
            msg.innerHTML = "❌ ОШИБКА: Команды запуска не распознаны.<br>Начни с <b>import turtle</b>";
            rover.style.display = 'none';
        }
    }
</script>
</body>
</html>
