<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <style>
        :root { --neon-cyan: #66fcf1; --mars-red: #ff4d00; --bg: #0b0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 10px; height: 95vh; display: flex; flex-direction: column; }
        #main-container { display: flex; gap: 10px; flex-grow: 1; }
        #editor-side, #canvas-side { flex: 1; display: flex; flex-direction: column; }
        textarea { background: #1f2833; color: #fff; border: 1px solid #45a29e; padding: 10px; font-size: 14px; flex-grow: 1; resize: none; outline: none; }
        #mycanvas { background: #1a0f0a; border: 2px solid #bf360c; border-radius: 8px; flex-grow: 1; }
        .run-btn { background: var(--mars-red); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        #output { color: #888; font-size: 12px; height: 20px; }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="editor-side">
            <textarea id="yourcode">import turtle
rover = turtle.Turtle()
rover.shape("turtle")
rover.color("cyan")
rover.speed(5)

# ТВОЙ КОД ЗДЕСЬ:
</textarea>
            <button class="run-btn" onclick="runit()">ИСПОЛНИТЬ МАНЕВР ▶️</button>
        </div>
        <div id="canvas-side">
            <div id="mycanvas"></div>
            <div id="output"></div>
        </div>
    </div>

<script>
    function outf(text) { document.getElementById("output").innerText = text; }
    function builtinRead(x) { return Sk.builtinFiles["files"][x]; }
    function runit() {
        let prog = document.getElementById("yourcode").value;
        document.getElementById("mycanvas").innerHTML = '';
        Sk.configure({output:outf, read:builtinRead});
        (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';
        Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, prog, true))
        .catch(err => outf(err.toString()));
    }
</script>
</body>
</html>
