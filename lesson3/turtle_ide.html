<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mars Python IDE</title>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    
    <style>
        :root { --neon-cyan: #66fcf1; --mars-red: #ff4d00; --bg: #0b0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        
        .header { text-align: center; margin-bottom: 10px; border-bottom: 1px solid var(--mars-red); padding-bottom: 5px; }
        
        #main-container { display: flex; gap: 20px; flex-grow: 1; min-height: 0; }
        
        #editor-side { flex: 1; display: flex; flex-direction: column; }
        #canvas-side { flex: 1; background: #1a0f0a; border: 2px solid #bf360c; border-radius: 10px; position: relative; overflow: hidden; }

        textarea { background: #1f2833; color: #fff; border: 1px solid var(--neon-cyan); padding: 15px; font-size: 16px; font-family: inherit; flex-grow: 1; resize: none; border-radius: 5px; outline: none; }
        
        .controls { padding: 15px 0; text-align: center; }
        .run-btn { background: var(--mars-red); color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        .run-btn:hover { background: #ff7043; box-shadow: 0 0 15px var(--mars-red); }

        /* Контейнер для вывода черепашки */
        #mycanvas { width: 100%; height: 100%; }
        
        #output { color: #888; font-size: 12px; margin-top: 5px; height: 40px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="header">
    <h3 style="margin:0; color: var(--neon-cyan);">🚀 МАРСИАНСКИЙ РЕДАКТОР КОДА V1.0</h3>
</div>

<div id="main-container">
    <div id="editor-side">
        <textarea id="yourcode" spellcheck="false">import turtle

rover = turtle.Turtle()
rover.color("cyan")
rover.pensize(5)

# Напиши свой маршрут ниже:
rover.forward(100)
rover.left(90)
rover.forward(100)
</textarea>
        <div id="output"></div>
    </div>

    <div id="canvas-side">
        <div id="mycanvas"></div>
    </div>
</div>

<div class="controls">
    <button class="run-btn" onclick="runit()">ЗАПУСТИТЬ СИСТЕМЫ 🛰️</button>
</div>

<script>
    function outf(text) { 
        var mypre = document.getElementById("output"); 
        mypre.innerHTML = mypre.innerHTML + text; 
    } 
    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
            throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
    }

    function runit() { 
       var prog = document.getElementById("yourcode").value; 
       var mypre = document.getElementById("output"); 
       mypre.innerHTML = ''; 
       Sk.pre = "output";
       Sk.configure({output:outf, read:builtinRead}); 
       
       // Настройка графики
       (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';
       
       var myPromise = Sk.misceval.asyncToPromise(function() {
           return Sk.importMainWithBody("<stdin>", false, prog, true);
       });
       
       myPromise.then(function(mod) {
           console.log('success');
       }, function(err) {
           outf("<span style='color:red'>" + err.toString() + "</span>");
       });
    } 
</script>

</body>
</html>
