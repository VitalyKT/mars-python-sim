<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --neon: #66fcf1; --mars: #ff4d00; --bg: #0b0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #map { width: 500px; height: 400px; border: 2px solid #333; position: relative; background: radial-gradient(circle, #1a0f0a 0%, #0b0c10 100%); cursor: crosshair; }
        .axis-x { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(102, 252, 241, 0.3); }
        .axis-y { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(102, 252, 241, 0.3); }
        #coords { margin-top: 15px; color: var(--neon); font-size: 20px; border: 1px solid var(--neon); padding: 10px 20px; border-radius: 5px; }
        .label { position: absolute; font-size: 10px; color: #555; }
    </style>
</head>
<body>
    <h3 style="color: var(--mars); margin: 0 0 10px 0;">🗺️ СКАНЕР КООРДИНАТ СЕКТОРА</h3>
    <div id="map" onmousemove="showCoords(event)">
        <div class="axis-x"></div>
        <div class="axis-y"></div>
        <div class="label" style="top: 51%; right: 5px;">+X</div>
        <div class="label" style="top: 51%; left: 5px;">-X</div>
        <div class="label" style="top: 5px; left: 51%;">+Y</div>
        <div class="label" style="bottom: 5px; left: 51%;">-Y</div>
        <div id="dot" style="position: absolute; width: 6px; height: 6px; background: red; border-radius: 50%; display: none; transform: translate(-50%, -50%);"></div>
    </div>
    <div id="coords">X: 0, Y: 0</div>

<script>
    function showCoords(event) {
        const map = document.getElementById('map');
        const rect = map.getBoundingClientRect();
        const dot = document.getElementById('dot');
        
        // Вычисляем координаты относительно центра (500x400)
        let x = Math.round(event.clientX - rect.left - 250);
        let y = Math.round(200 - (event.clientY - rect.top));
        
        document.getElementById('coords').innerText = `X: ${x}, Y: ${y}`;
        
        dot.style.display = 'block';
        dot.style.left = (event.clientX - rect.left) + 'px';
        dot.style.top = (event.clientY - rect.top) + 'px';
    }
</script>
</body>
</html>
