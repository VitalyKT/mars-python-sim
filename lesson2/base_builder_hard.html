<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <style>
        :root { --neon: #66fcf1; --mars: #ff4d00; --bg: #0b0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 95vh; overflow: hidden; }
        #main { display: flex; gap: 15px; flex-grow: 1; min-height: 0; }
        #editor-side, #canvas-side { flex: 1; display: flex; flex-direction: column; }
        textarea { background: #000; color: var(--neon); border: 1px solid #444; padding: 15px; font-size: 15px; flex-grow: 1; resize: none; outline: none; border-radius: 5px; }
        #mycanvas { background: #1a0f0a; border: 2px solid #bf360c; border-radius: 10px; flex-grow: 1; }
        .run-btn { background: var(--mars); color: #fff; border: none; padding: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px; text-transform: uppercase; }
        #status { font-size: 14px; color: #888; margin-top: 10px; text-align: center; height: 20px; }
        .mission { background: rgba(102, 252, 241, 0.05); padding: 10px; border-radius: 5px; border-left: 4px solid var(--neon); margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="mission">
        <strong>ЗАДАНИЕ:</strong> С нуля напиши код для постройки двух цветных модулей базы (квадратов). <br>
        Используй <b>penup()</b> и <b>pendown()</b>, чтобы они не были соединены линией.
    </div>

    <div id="main">
        <div id="editor-side">
            <textarea id="yourcode" spellcheck="false"># 1. Подключи библиотеку
# 2. Создай объект ровера
# 3. Настрой стиль (цвет, форма, толщина)
# 4. Нарисуй два модуля в разных местах
</textarea>
            <button class="run-btn" onclick="runit()">ОТПРАВИТЬ КОД НА МАРС ▶️</button>
        </div>
        <div id="canvas-side">
            <div id="mycanvas"></div>
            <div id="status">Ожидание команд...</div>
        </div>
    </div>

<script>
    function outf(text) { console.log(text); }
    function builtinRead(x) { return Sk.builtinFiles["files"][x]; }
    
    function runit() {
        const prog = document.getElementById("yourcode").value;
        const status = document.getElementById("status");
        document.getElementById("mycanvas").innerHTML = '';
        status.innerText = "📡 ПЕРЕДАЧА ДАННЫХ...";

        Sk.configure({output:outf, read:builtinRead});
        (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';
        
        Sk.misceval.asyncToPromise(() => {
            return Sk.importMainWithBody("<stdin>", false, prog, true);
        }).then(() => {
            const code = document.getElementById("yourcode").value;
            const hasStart = code.includes('import turtle') && code.includes('Turtle()');
            const hasJump = code.includes('penup') && code.includes('pendown');
            
            if (hasStart && hasJump) {
                status.innerText = "✅ МИССИЯ ВЫПОЛНЕНА! Ты настоящий программист.";
                status.style.color = "#2ecc71";
            } else if (!hasStart) {
                status.innerText = "❌ ОШИБКА: Забыл инициализацию (import/Turtle)!";
                status.style.color = "#ff4d00";
            } else {
                status.innerText = "⚠️ Почти! Но не забудь про прыжок (penup/pendown).";
                status.style.color = "#f1fa8c";
            }
        }).catch(err => {
            status.innerText = "❌ ОШИБКА: " + err.toString();
            status.style.color = "#ff4d00";
        });
    }
</script>
</body>
</html>
