<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --neon: #66fcf1; --mars: #ff4d00; --bg: #0b0c10; --box: #c5a059; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .workshop { display: flex; gap: 30px; margin-top: 20px; background: #151515; padding: 30px; border-radius: 15px; border: 2px dashed #444; }
        
        .part-column { display: flex; flex-direction: column; gap: 15px; align-items: center; border-right: 1px solid #333; padding-right: 20px; }
        .part-column:last-child { border: none; }
        
        .item { 
            width: 90px; height: 50px; background: #222; border: 1px solid var(--neon); 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border-radius: 5px; font-size: 14px; transition: 0.3s;
        }
        .item:hover { background: var(--neon); color: #000; transform: scale(1.05); }
        .item.selected { background: var(--mars); border-color: #fff; color: #fff; }

        /* Итоговая коробка */
        #result-area { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .big-box {
            width: 150px; height: 110px; background: var(--box); border: 3px solid #8e6d2d;
            border-radius: 8px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: 0.5s;
        }
        .big-box .val-text { font-size: 32px; font-weight: bold; color: #3e2723; }
        .big-box .label-sticker { 
            position: absolute; bottom: -15px; background: #eee; color: #000; 
            padding: 2px 10px; border: 1px solid #999; font-weight: bold; font-size: 14px;
        }

        #code-display { 
            margin-top: 30px; background: #000; padding: 15px 30px; border-radius: 10px; 
            border-left: 5px solid var(--mars); font-size: 20px; color: var(--neon);
        }
        .instruction { color: #888; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2 style="color: var(--neon);">🏗️ КОНСТРУКТОР ПЕРЕМЕННЫХ</h2>
    <div class="instruction">Выбери <b>ИМЯ</b> для наклейки и <b>ЧИСЛО</b> для груза, чтобы собрать переменную</div>

    <div class="workshop">
        <div class="part-column">
            <div style="font-size: 12px; color: var(--mars);">1. ВЫБЕРИ ИМЯ</div>
            <div class="item" onclick="setName('size', this)">size</div>
            <div class="item" onclick="setName('steps', this)">steps</div>
            <div class="item" onclick="setName('speed', this)">speed</div>
        </div>

        <div class="part-column">
            <div style="font-size: 12px; color: var(--mars);">2. ВЫБЕРИ ГРУЗ</div>
            <div class="item" onclick="setVal(50, this)">50</div>
            <div class="item" onclick="setVal(100, this)">100</div>
            <div class="item" onclick="setVal(200, this)">200</div>
        </div>

        <div id="result-area">
            <div style="font-size: 12px; color: var(--mars);">ГОТОВАЯ ПЕРЕМЕННАЯ</div>
            <div class="big-box" id="visual-box">
                <div class="val-text" id="v-val">?</div>
                <div class="label-sticker" id="v-name">имя</div>
            </div>
        </div>
    </div>

    <div id="code-display">
        строка кода: <span id="python-code">... = ...</span>
    </div>

    <p style="color: #666; margin-top: 20px; max-width: 500px; text-align: center;">
        Когда ты нажимаешь на кнопки, ты создаешь связь. Имя слева, число справа, а между ними знак <b>=</b>.
    </p>

<script>
    let currentName = '...';
    let currentVal = '...';

    function setName(name, el) {
        currentName = name;
        document.getElementById('v-name').innerText = name;
        updateCode();
        highlight(el, 'name');
    }

    function setVal(val, el) {
        currentVal = val;
        document.getElementById('v-val').innerText = val;
        updateCode();
        highlight(el, 'val');
    }

    function highlight(el, type) {
        const items = el.parentElement.querySelectorAll('.item');
        items.forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
    }

    function updateCode() {
        document.getElementById('python-code').innerText = `${currentName} = ${currentVal}`;
    }
</script>
</body>
</html>
