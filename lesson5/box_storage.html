<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <style>
        :root { --neon: #66fcf1; --mars: #ff4d00; --bg: #0b0c10; --box: #c5a059; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 98vh; overflow: hidden; }
        
        /* Визуальный Склад */
        #warehouse { 
            background: #151515; border: 2px solid #333; border-radius: 10px; padding: 15px; 
            margin-bottom: 10px; display: flex; gap: 20px; overflow-x: auto; min-height: 120px;
            align-items: flex-end;
        }
        .cargo-box {
            width: 100px; position: relative; display: flex; flex-direction: column; align-items: center;
            animation: bounceIn 0.5s ease-out;
        }
        .box-body {
            width: 80px; height: 60px; background: var(--box); border: 2px solid #8e6d2d;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            color: #3e2723; font-weight: bold; font-size: 20px; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }
        .box-body::after { content: ''; position: absolute; top: 10px; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.1); }
        .box-label {
            background: #eee; color: #000; padding: 2px 6px; font-size: 12px; margin-top: 5px;
            border-radius: 3px; font-weight: bold; border: 1px solid #999;
        }

        #main { display: flex; gap: 10px; flex-grow: 1; min-height: 0; }
        #editor-side, #canvas-side { flex: 1; display: flex; flex-direction: column; }
        textarea { background: #000; color: var(--neon); border: 1px solid #444; padding: 15px; font-size: 15px; flex-grow: 1; resize: none; outline: none; border-radius: 5px; line-height: 1.5; }
        #mycanvas { background: #1a0f0a; border: 2px solid #333; border-radius: 10px; flex-grow: 1; }
        
        .run-btn { background: var(--mars); color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; text-transform: uppercase; margin-top: 5px; }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div style="font-size: 14px; color: var(--neon); margin-bottom: 5px; text-align: center;">📦 ГРУЗОВОЙ ОТСЕК РОВЕРА (СКЛАД ПЕРЕМЕННЫХ)</div>
    <div id="warehouse">
        <span style="color: #444;">Склад пуст. Создай свою первую коробку в коде...</span>
    </div>

    <div id="main">
        <div id="editor-side">
            <textarea id="yourcode" spellcheck="false" oninput="updateWarehouse()">import turtle
rover = turtle.Turtle()
rover.color("#66fcf1")

# 1. Создай коробку 'size' и положи туда 100
size = 100

# 2. А теперь измени груз на 50:
size = 50

# 3. Ровер заглянет в коробку и возьмет число:
rover.forward(size)</textarea>
            <button class="run-btn" onclick="runit()">ЗАПУСТИТЬ ПРОВЕРКУ ▶️</button>
        </div>
        <div id="canvas-side">
            <div id="mycanvas"></div>
        </div>
    </div>

<script>
    function updateWarehouse() {
        const code = document.getElementById("yourcode").value;
        const warehouse = document.getElementById("warehouse");
        
        // Магия: ищем все переменные и их ПОСЛЕДНИЕ значения
        const lines = code.split('\n');
        const variables = {};
        const regex = /([a-zA-Z_]\w*)\s*=\s*(\d+)/;

        lines.forEach(line => {
            const match = line.match(regex);
            if (match) {
                if (match[1] !== 'i') { // не трогаем счетчик цикла
                    variables[match[1]] = match[2];
                }
            }
        });

        let html = '';
        for (let name in variables) {
            html += `
                <div class="cargo-box">
                    <div class="box-body">${variables[name]}</div>
                    <div class="box-label">${name}</div>
                </div>`;
        }

        if (html === '') {
            warehouse.innerHTML = '<span style="color: #444;">Ожидание команды (например: speed = 5)...</span>';
        } else {
            warehouse.innerHTML = html;
        }
    }

    updateWarehouse();

    function outf(text) { console.log(text); }
    function builtinRead(x) { return Sk.builtinFiles["files"][x]; }
    
    function runit() {
        const prog = document.getElementById("yourcode").value;
        document.getElementById("mycanvas").innerHTML = '';
        Sk.configure({output:outf, read:builtinRead});
        (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';
        Sk.misceval.asyncToPromise(() => {
            return Sk.importMainWithBody("<stdin>", false, prog, true);
        });
    }
</script>
</body>
</html>
